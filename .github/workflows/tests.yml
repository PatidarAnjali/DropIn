# Runs DropIn's unit tests on every push and pull request.
# Results show up in the repo's "Actions" tab, and the badge in the
# README turns green (passing) or red (failing).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  unit-tests:
    name: Unit tests
    # Needs a macOS image with Xcode 26.2+ (the app targets iOS 26.2).
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages (Firebase)
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('DropIn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          # xcbeautify makes the log readable; fall back to plain output if it's missing.
          FORMAT="cat"
          if command -v xcbeautify >/dev/null; then FORMAT="xcbeautify --renderer github-actions"; fi
          xcodebuild test \
            -project DropIn.xcodeproj \
            -scheme DropIn \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:DropInTests \
            CODE_SIGNING_ALLOWED=NO \
            | $FORMAT
